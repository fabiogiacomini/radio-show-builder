name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macOS-arm64
          - runner: macos-15-intel
            target: macOS-x64
          - runner: windows-2022
            target: Windows-x64
          - runner: ubuntu-22.04
            target: Linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt && python -m pip install --no-deps .
      - name: Verify corresponding sources
        run: python packaging/fetch_sources.py
      - name: Prepare Windows compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make diffutils tar
      - name: Build Windows audio engine
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash packaging/build_ffmpeg.sh
      - name: Build audio engine
        if: runner.os != 'Windows'
        run: bash packaging/build_ffmpeg.sh
      - name: Test source workflow with the release audio engine
        run: |
          export RSB_FFMPEG="$PWD/build/vendor/bin/ffmpeg"
          if [[ "$RUNNER_OS" == Windows ]]; then export RSB_FFMPEG="$RSB_FFMPEG.exe"; fi
          python -m unittest discover -s tests -v
      - name: Build and test portable app
        run: python packaging/build_desktop.py --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostic details
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/smoke-*.json
            build/audio-source/ffmpeg-*/ffbuild/config.log
            build/pyinstaller/**/warn-*.txt
          retention-days: 7
